openapi: 3.1.0
info:
  title: URL Shortener API
  version: "1.0"
paths:
  /api/urls:
    post:
      summary: Create a shortened URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [long_url]
              properties:
                long_url: {type: string, format: uri}
                custom_alias: {type: string, nullable: true}
                expires_at: {type: string, format: date-time, nullable: true}
      responses:
        "201": {description: created}
        "409": {description: alias already in use}
        "422": {description: invalid long_url}
        "429": {description: rate limited}
  /{code}:
    get:
      summary: Redirect to the original long URL
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string}
      responses:
        "302": {description: redirect}
        "404": {description: unknown code}
        "410": {description: expired}
  /api/urls/{code}:
    get:
      summary: Get metadata for a short code
      responses:
        "200": {description: ok}
        "404": {description: unknown code}
    delete:
      summary: Revoke a short code
      responses:
        "204": {description: revoked}
        "404": {description: unknown code}
  /api/urls/{code}/stats:
    get:
      summary: Get click analytics for a short code
      responses:
        "200": {description: ok}
        "404": {description: unknown code}

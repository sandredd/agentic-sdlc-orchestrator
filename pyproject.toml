[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-orchestrator"
version = "0.1.0"
description = "An agentic orchestration layer that drives a requirement through the full SDLC under governance."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # starlette's TestClient prefers httpx2 and only falls back to httpx (with
    # a deprecation warning) if httpx2 is absent -- depending on both means
    # this stays warning-free now and keeps working if that fallback is ever
    # removed.
    "httpx2>=2.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
asdlc = "orchestrator.cli:app"

[tool.setuptools.packages.find]
include = ["orchestrator*", "target*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:orchestrator.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's documented pattern is `typer.Option(...)` as an argument default.
"orchestrator/cli.py" = ["B008"]
